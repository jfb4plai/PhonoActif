<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>États lettre par lettre (Charline)</title>
<style>body{font-family:Arial,sans-serif;font-size:16px;margin:16px;background:#faf9f7;color:#222}
h2{color:#0f6e56;margin-top:28px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:6px;vertical-align:middle}
th{background:#0f6e56;color:#fff;text-align:left}.l{font-size:24px;font-weight:bold}audio{width:200px;height:34px}
select{font-size:16px}button{font-size:16px;padding:8px 14px}pre{background:#fff;border:1px solid #ccc;padding:8px;white-space:pre-wrap}</style></head><body>
<h1>États lettre par lettre : écoute</h1>
<p>Pour chaque lettre posée, écouter ce que l'app dirait. Noter : <b>bon</b>, <b>faux</b> (autre son attendu), <b>voyelle ajoutée</b>, <b>coupé ou bruit</b>.
La colonne « lecture » montre comment les règles ont découpé et lu (le point d'interrogation = choix signalé à l'enseignant).</p>
<div id="t"></div><button onclick="bilan()">Copier le bilan</button><pre id="b"></pre>
<script>
var DATA = [{"id": "soleil-1-s", "mot": "soleil", "lettres": "s", "ipa": "s", "nbSons": 1, "source": "regles", "lecture": "s=s", "vitesse": 0}, {"id": "soleil-2-so", "mot": "soleil", "lettres": "so", "ipa": "so", "nbSons": 2, "source": "regles", "lecture": "s=s o=o_ferme", "vitesse": -30}, {"id": "soleil-3-sol", "mot": "soleil", "lettres": "sol", "ipa": "sɔl", "nbSons": 3, "source": "regles", "lecture": "s=s o=o_ouvert l=l", "vitesse": -30}, {"id": "soleil-4-sole", "mot": "soleil", "lettres": "sole", "ipa": "sɔl", "nbSons": 3, "source": "regles", "lecture": "s=s o=o_ouvert l=l e=muet", "vitesse": -30}, {"id": "soleil-5-solei", "mot": "soleil", "lettres": "solei", "ipa": "sɔlɛ", "nbSons": 4, "source": "regles", "lecture": "s=s o=o_ouvert l=l ei=e_ouvert", "vitesse": -30}, {"id": "soleil-6-soleil", "mot": "soleil", "lettres": "soleil", "ipa": "sɔlɛj", "nbSons": 5, "source": "correction", "lecture": "s=s o=o_ouvert l=l eil=e_ouvert+yod", "vitesse": -30}, {"id": "oeuf-1-o", "mot": "oeuf", "lettres": "o", "ipa": "o", "nbSons": 1, "source": "regles", "lecture": "o=o_ferme", "vitesse": 0}, {"id": "oeuf-2-oe", "mot": "oeuf", "lettres": "oe", "ipa": "ɔ", "nbSons": 1, "source": "regles", "lecture": "o=o_ouvert e=muet", "vitesse": 0}, {"id": "oeuf-3-oeu", "mot": "oeuf", "lettres": "oeu", "ipa": "ø", "nbSons": 1, "source": "regles", "lecture": "oeu=eu_ferme", "vitesse": 0}, {"id": "oeuf-4-oeuf", "mot": "oeuf", "lettres": "oeuf", "ipa": "œf", "nbSons": 2, "source": "lexique", "lecture": "oeu=eu_ouvert f=f", "vitesse": -30}, {"id": "oeuf-lig-2-oeu", "mot": "œuf", "lettres": "œu", "ipa": "ø", "nbSons": 1, "source": "regles", "lecture": "œu=eu_ferme", "vitesse": 0}, {"id": "oeuf-lig-3-oeuf", "mot": "œuf", "lettres": "œuf", "ipa": "œf", "nbSons": 2, "source": "regles", "lecture": "œu=eu_ouvert f=f", "vitesse": -30}], cle = "essai-etats-v1", ETAT = {};
try { ETAT = JSON.parse(localStorage.getItem(cle) || "{}"); } catch (e) {}
function sauve(k, v) { ETAT[k] = v; try { localStorage.setItem(cle, JSON.stringify(ETAT)); } catch (e) {} }
var h = "", mot = "";
DATA.forEach(function (e) {
  if (e.mot !== mot) { if (mot) h += "</table>"; mot = e.mot; h += "<h2>" + e.mot + "</h2><table><tr><th>Posé</th><th>Écouter (normalisé)</th><th>Original</th><th>IPA</th><th>Vitesse</th><th>Lecture</th><th>Note</th></tr>"; }
  h += "<tr><td class='l'>" + e.lettres + "</td><td><audio controls preload='none' src='sortie/azure__fr-BE-CharlineNeural__etats_norm/" + encodeURIComponent(e.id) + ".mp3'></audio></td><td><audio controls preload='none' src='sortie/azure__fr-BE-CharlineNeural__etats/" + encodeURIComponent(e.id) + ".mp3'></audio></td><td>/" + e.ipa + "/</td><td>" + e.vitesse + " %</td><td>" + e.lecture + "</td><td><select onchange=\"sauve('" + e.id + "', this.value)\">" +
    ["", "bon", "faux", "voyelle ajoutée", "coupé ou bruit"].map(function (o) { return "<option" + ((ETAT[e.id] || "") === o ? " selected" : "") + ">" + o + "</option>"; }).join("") + "</select></td></tr>";
});
document.getElementById("t").innerHTML = h + "</table>";
function bilan() { var l = []; Object.keys(ETAT).forEach(function (k) { if (ETAT[k]) l.push(k + " : " + ETAT[k]); });
  var t = l.join("\n") || "(rien noté)"; document.getElementById("b").textContent = t; try { navigator.clipboard.writeText(t); } catch (e) {} }
</script></body></html>
